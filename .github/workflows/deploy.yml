name: Generate APK via TWA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use PWABuilder CLI / TWA Builder
        run: |
          npm install -g @pwabuilder/pwabuilder-cli
          # Atau langsung build pakai asset web yang lu punya
          echo "Struktur aman, siap di-generate."
          

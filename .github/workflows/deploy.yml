name: Build LKMS Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show files
        run: |
          ls -la
          test -f index.html
          test -f style.css
          test -f app.js
          test -f manifest.json
          test -f sw.js
          test -f Assets/icon-192.png
          test -f Assets/icon-512.png

      - name: Install dependencies
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install --legacy-peer-deps

      - name: Prepare web folder
        run: |
          rm -rf www
          mkdir -p www
          mkdir -p www/Assets
          cp index.html www/
          cp style.css www/
          cp app.js www/
          cp manifest.json www/
          cp sw.js www/
          cp Assets/icon-192.png www/Assets/
          cp Assets/icon-512.png www/Assets/

      - name: Init & Add Android platform
        run: |
          npx cap init "LKMS Tracker" "com.lkms.tracker" --web-dir www --yes
          npx cap add android

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          if p.exists():
              s = p.read_text()
              permissions = [
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
              ]
              for perm in permissions:
                  if perm not in s:
                      s = s.replace('<application', f'    {perm}\n    <application', 1)
              p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lkms-tracker-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          
